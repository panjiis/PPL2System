# ==================================
# GitHub Actions Workflow
# Lokasi: ./.github/workflows/main.yml
# ==================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - Staging
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and push GO Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.go
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/Staging-ppl2system-go:latest
            ghcr.io/${{ github.repository_owner }}/Staging-ppl2system-go:${{ github.sha }}

      - name: 5. Build and push PYTHON Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./analytics_service/dockerfile.py
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/Staging-ppl2system-python:latest
            ghcr.io/${{ github.repository_owner }}/Staging-ppl2system-python:${{ github.sha }}