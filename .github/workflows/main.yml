# ==================================
# GitHub Actions Workflow
# Lokasi: ./.github/workflows/main.yml
# ==================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - Staging
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Run Go Vet (Report Only)
        run: go vet ./... || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.6'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run Pylint (Report Only)
        run: pylint --exit-zero analytics_service/


      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and push GO Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/staging-ppl2system-go:latest
            ghcr.io/${{ github.repository_owner }}/staging-ppl2system-go:${{ github.sha }}

      - name: 5. Build and push PYTHON Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./analytics_service/dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/staging-ppl2system-python:latest
            ghcr.io/${{ github.repository_owner }}/staging-ppl2system-python:${{ github.sha }}